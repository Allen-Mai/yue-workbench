name: CI · 类型检查 + 构建 + 体积体检

# 说明：正式部署由 Vercel 的 Git 集成完成（每次 push 自动构建并发布，
# 永久链接保持不变）。这个工作流只做质量门禁，避免把坏代码推上线。

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run typecheck

      - name: 构建（Vite 按需构建）
        run: pnpm run build:only

      - name: 体积体检（gzip < 500KB）
        run: node scripts/report-size.mjs

      - name: 安全审计
        run: pnpm audit --prod || true

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
