<!doctype html>
<html lang="zh-CN" data-eye="soft" data-fs="m" data-round="soft" data-motion="on">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
  <title>月月的工作台 · 像素森系</title>
  <meta name="description" content="像素森系个人工作台：今日中枢 · 植物养护 · 灵感补给 · 财富工坊 · 时光胶囊 · 智能提醒 · 成就殿堂。天地通，年月通，日事通，万事皆成！" />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#1A3C2A" />
  <meta name="color-scheme" content="light" />

  <!-- iOS 添加到主屏幕 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="月月工作台" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="mask-icon" href="./favicon.svg" color="#1A3C2A" />

  <style>
    /* 首屏关键样式（防白屏 + 立即呈现启动页） */
    html,body{margin:0;height:100%;background:#FDF8EC;color:#3D2C1B;
      font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;}
    #splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;
      background:linear-gradient(180deg,#FDF8EC 0%,#F3EDD9 46%,#E4EEDD 74%,#C9DCC2 100%);
      transition:opacity .55s cubic-bezier(.4,0,.2,1),visibility .55s;
      /* 纯 CSS 兜底：即使 JS 完全没跑起来，10 秒后也自动淡出，绝不永久卡在启动页 */
      animation:splash-giveup .6s ease 10s forwards}
    #splash.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
    @keyframes splash-giveup{to{opacity:0;visibility:hidden;pointer-events:none}}
    .sp-wrap{text-align:center;padding:24px;max-width:520px}
    .sp-motto{font-size:19px;letter-spacing:2px;color:#1A3C2A;margin-top:18px;text-shadow:0 1px 0 rgba(255,255,255,.6)}
    .sp-motto i{display:inline-block;font-style:normal;animation:sp-sway 3.6s cubic-bezier(.4,0,.2,1) infinite}
    .sp-sub{font-size:12px;color:#9A7B52;letter-spacing:1px;margin-top:6px}
    .sp-bar{width:190px;height:6px;margin:18px auto 0;border-radius:999px;background:rgba(61,44,27,.1);overflow:hidden}
    .sp-bar i{display:block;height:100%;width:38%;border-radius:inherit;
      background:linear-gradient(90deg,#7DBF8A,#5A7A4A);animation:sp-load 1.25s cubic-bezier(.4,0,.2,1) infinite}
    .sp-art{display:flex;justify-content:center;align-items:flex-end;gap:10px}
    .sp-dog{animation:sp-float 3.8s ease-in-out infinite}
    .sp-apple{animation:sp-breathe 4.2s ease-in-out infinite}
    @keyframes sp-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
    @keyframes sp-load{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}
    @keyframes sp-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes sp-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @media (prefers-reduced-motion: reduce){.sp-motto i,.sp-bar i,.sp-dog,.sp-apple{animation:none}}
  </style>
</head>
<body>
  <!-- 启动页：手绘像素苹果 + 线条小狗 + 层次草地 -->
  <div id="splash" role="status" aria-label="正在加载">

        <!-- 线条小狗 -->

            <path d="M20 22a12 12 0 1 0 24 0a12 12 0 1 0-24 0"/>
            <path d="M20 16c-6-2-10 3-9 9s5 9 9 6"/>
            <path d="M44 16c6-2 10 3 9 9s-5 9-9 6"/>
            <circle cx="27" cy="20" r="1.7" fill="#5B4030" stroke="none"/>
            <circle cx="37" cy="20" r="1.7" fill="#5B4030" stroke="none"/>
            <path d="M32 25c-1.6 0-2.6 1.2-2.6 2.4S30.4 30 32 30s2.6-1.4 2.6-2.6S33.6 25 32 25z"/>
            <path d="M32 30v3"/>
            <path d="M32 33c-1.8 3-5 3.2-7.2 1.2"/>
            <path d="M32 33c1.8 3 5 3.2 7.2 1.2"/>
            <path d="M22 34c-4 8-2 16 4 20h12c6-4 8-12 4-20"/>
            <path d="M26 54v6"/><path d="M38 54v6"/>
            <path d="M46 36c6-2 9 5 6 11"/>
          </g>
        </svg>
        <!-- 像素苹果 -->
        <svg class="sp-apple" viewBox="0 0 16 16" width="76" height="76" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="5" y="5" width="6" height="1" fill="#D64550"/><rect x="4" y="6" width="8" height="1" fill="#D64550"/>
          <rect x="3" y="7" width="10" height="6" fill="#D64550"/><rect x="4" y="13" width="8" height="1" fill="#D64550"/>
          <rect x="5" y="14" width="6" height="1" fill="#D64550"/>
          <rect x="5" y="7" width="2" height="2" fill="#E9898F"/><rect x="4" y="8" width="2" height="3" fill="#E9898F"/>
          <rect x="7" y="2" width="2" height="3" fill="#8B6B47"/>
          <rect x="9" y="2" width="3" height="1" fill="#7DBF8A"/><rect x="10" y="1" width="2" height="2" fill="#7DBF8A"/>
        </svg>
      </div>
      <!-- 层次草地 -->
      <svg viewBox="0 0 320 110" width="320" height="110" shape-rendering="crispEdges" aria-hidden="true" style="max-width:86vw;height:auto">
        <rect x="0" y="46" width="320" height="12" fill="#A3C795"/><rect x="0" y="58" width="320" height="12" fill="#8FB683"/>
        <g>
          <rect x="30" y="24" width="18" height="6" fill="#4F7040"/><rect x="24" y="30" width="30" height="6" fill="#4F7040"/>
          <rect x="18" y="36" width="42" height="6" fill="#5A7A4A"/><rect x="36" y="42" width="6" height="10" fill="#8B6B47"/>
        </g>
        <g>
          <rect x="252" y="18" width="22" height="6" fill="#4F7040"/><rect x="244" y="24" width="38" height="6" fill="#4F7040"/>
          <rect x="238" y="30" width="50" height="6" fill="#5A7A4A"/><rect x="258" y="36" width="7" height="12" fill="#8B6B47"/>
        </g>
        <rect x="0" y="56" width="320" height="12" fill="#7DBF8A"/><rect x="0" y="68" width="320" height="14" fill="#5A7A4A"/>
        <rect x="0" y="82" width="320" height="12" fill="#4F7040"/><rect x="0" y="94" width="320" height="16" fill="#436034"/>
        <g>
          <rect x="70" y="60" width="4" height="10" fill="#5A7A4A"/><rect x="66" y="56" width="4" height="4" fill="#E9898F"/>
          <rect x="74" y="56" width="4" height="4" fill="#E9898F"/><rect x="70" y="53" width="4" height="4" fill="#E9898F"/>
          <rect x="200" y="66" width="4" height="10" fill="#5A7A4A"/><rect x="196" y="62" width="4" height="4" fill="#F0D58C"/>
          <rect x="204" y="62" width="4" height="4" fill="#F0D58C"/><rect x="200" y="59" width="4" height="4" fill="#F0D58C"/>
          <rect x="280" y="58" width="4" height="10" fill="#5A7A4A"/><rect x="276" y="54" width="4" height="4" fill="#E8A87C"/>
          <rect x="284" y="54" width="4" height="4" fill="#E8A87C"/><rect x="280" y="51" width="4" height="4" fill="#E8A87C"/>
        </g>
      </svg>
      <div class="sp-motto"><i>天地通，年月通，日事通，万事皆成！</i></div>
      <div class="sp-sub">像素森系 · 个人工作台 v10.0</div>
      <div class="sp-bar"><i></i></div>
    </div>
  </div>

  <div id="app" class="app"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
